@if(searchRecipe(); as onereceta){
<app-detail-recipe 
[receta]="onereceta"
(closerecipe)="onSelect($event)">
</app-detail-recipe>
}
<section>
    @for(receta of recipeList(); track receta.id){
        <app-card-recipe 
        [recipecard]="receta"
        (clickCard)="onSelect($event)"> 
        </app-card-recipe>
    }
</section>
